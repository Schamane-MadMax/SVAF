name: tests

on:
  push:
  pull_request:

jobs:
  pytest:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ["3.9", "3.12"]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "${{ matrix.python }}"
      - run: pip install -e ".[dev]" jsonschema
      - run: python -m pytest tests/ -q

  wheel-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Wheel bauen und in frischem venv installieren
        run: |
          pip install build
          python -m build --wheel
          python -m venv /tmp/smoke
          /tmp/smoke/bin/pip install dist/*.whl
      - name: Schemas muessen im Paket liegen (Symlink-Regression)
        run: |
          cd /tmp
          /tmp/smoke/bin/svaf validate "$GITHUB_WORKSPACE/tests/fixtures/asbuilt.svaf"
