    <rect x="140" y="176" width="28" height="160" rx="14"/>
    <rect x="184" y="136" width="28" height="240" rx="14"/>
    <rect x="228" y="192" width="28" height="128" rx="14"/>
    <!-- Zeilen: Transkript/Events -->
    <rect x="284" y="150" width="132" height="28" rx="14" fill="#a5b4fc"/>
    <rect x="284" y="214" width="100" height="28" rx="14" fill="#c7d2fe"/>
    <rect x="284" y="278" width="132" height="28" rx="14" fill="#e0e7ff"/>
  </g>
  <!-- Zeitachse mit Event-Punkt -->
  <rect x="96" y="368" width="320" height="12" rx="6" fill="#818cf8"/>
  <circle cx="256" cy="374" r="22" fill="#fb923c"/>
